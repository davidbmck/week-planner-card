name: 'Validate Build'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Test build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm test
      - name: Install browser for layout checks
        run: npx playwright install --with-deps chromium
      - name: Build and check browser layouts
        run: npm run test:browser
